name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Coverage is a report only for now (roadmap step 15): no --cov-fail-under threshold yet.
      - run: >-
          pytest tests/ -v
          --cov=services --cov=utils --cov=repositories --cov=database --cov=cogs
          --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Same pre-commit version as requirements-dev.txt, without installing the bot's dependencies.
      # The hooks (ruff check, ruff format, whitespace, YAML, private keys) come from .pre-commit-config.yaml;
      # a hook that fixes a file fails the job and prints the diff.
      - run: pip install "$(grep -E '^pre-commit==' requirements-dev.txt)"
      - run: pre-commit run --all-files --show-diff-on-failure
