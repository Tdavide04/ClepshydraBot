target-version = "py312"
# 110 matches the width the code and the docs were already written to, and gives the smallest
# reformatting diff of the widths tried (88, 100, 110, 120).
line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]

[format]
# Markdown code blocks are hand-aligned examples, not code to reformat.
exclude = ["*.md"]
